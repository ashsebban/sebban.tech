<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shape Runner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.3/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #111; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #runner { display: flex; width: min(100%, 400px); height: 100%; flex-direction: column; justify-content: center; }
    #playfield { position: relative; display: grid; min-height: 0; place-items: center; }
    #controls { display: flex; align-items: center; gap: 8px; padding: 8px; min-height: 60px; color: #e5ebf7; font: 13px system-ui, sans-serif; }
    #gesture-hint { flex: 1; }
    #controls button { min-height: 44px; padding: 0 10px; border: 1px solid #344364; border-radius: 8px; background: #1a2740; color: #fff; font: 600 13px system-ui, sans-serif; }
    #controls #switch-shape { background: #1f59ae; }
    #controls button:disabled { opacity: 0.55; }
    #guide[hidden] { display: none; }
    #guide { position: absolute; z-index: 1; inset: 0; display: grid; align-items: safe center; justify-items: center; overflow: auto; padding: 12px; background: #080b14bd; color: #f5f8ff; font: 14px/1.35 system-ui, sans-serif; }
    .guide-card { width: min(100%, 320px); padding: clamp(12px, 4vw, 22px); border: 1px solid #425578; border-radius: 16px; background: #121c30; box-shadow: 0 12px 32px #05091480; }
    .guide-card h1 { font-size: clamp(21px, 6vw, 29px); line-height: 1.15; margin-bottom: 6px; }
    .guide-lead, .key-hint { color: #c2cee3; }
    .shape-guide { display: grid; gap: 5px; list-style: none; margin: 12px 0; }
    .shape-guide li { display: grid; grid-template-columns: 29px 1fr; gap: 8px; align-items: center; min-height: 39px; padding: 4px 8px; border-radius: 8px; background: #202e48; }
    .shape-guide strong { display: block; }
    .shape-guide small { font-size: 12px; color: #d0dded; }
    .shape { display: block; justify-self: center; width: 15px; height: 15px; }
    .circle { border-radius: 50%; background: #73eca9; }
    .square { background: #83b7ff; border-radius: 2px; }
    .triangle { background: #ff858a; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .key-hint { font-size: 12px; }
    .guide-choice { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; font-size: 13px; }
    .guide-choice input { accent-color: #8cbaff; width: 16px; height: 16px; }
    #guide-start { width: 100%; min-height: 44px; border: 0; border-radius: 8px; background: #a7cbff; color: #10192b; font: 750 15px system-ui; cursor: pointer; }
    #guide :focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    @media (pointer: coarse) { .key-hint { display: none; } }
    canvas {
      display: block;
      max-width: min(100vw, calc((100vh - 60px) * 400 / 600));
      max-width: min(100vw, calc((100dvh - 60px) * 400 / 600));
      height: auto !important;
      touch-action: none;
    }
  </style>
</head>
<body>
  <main id="runner">
    <div id="playfield">
      <section id="guide" aria-labelledby="guide-title">
        <div class="guide-card">
          <h1 id="guide-title">Shape Runner</h1>
          <p class="guide-lead">Match your shape to the next opening.</p>
          <ul class="shape-guide">
            <li><span class="shape circle" aria-hidden="true"></span><div><strong>Green circle</strong><small>Tap to jump</small></div></li>
            <li><span class="shape square" aria-hidden="true"></span><div><strong>Blue square</strong><small>Swipe to move one row</small></div></li>
            <li><span class="shape triangle" aria-hidden="true"></span><div><strong>Red triangle</strong><small>Swipe between top and bottom</small></div></li>
          </ul>
          <p class="guide-lead">Use <strong>Switch shape</strong> to change.</p>
          <p class="key-hint">Keyboard: Space switches shape. ↑ and ↓ move.</p>
          <label class="guide-choice"><input type="checkbox" id="skip-guide"> Skip this guide next time</label>
          <button type="button" id="guide-start" disabled>Start run</button>
        </div>
      </section>
    </div>
    <div id="controls">
      <p id="gesture-hint">Circle · Tap to jump</p>
      <button type="button" id="switch-shape">Switch shape</button>
      <button type="button" id="pause-run">Pause</button>
    </div>
  </main>
  <script type="module" src="src/main.js"></script>
</body>
</html>
