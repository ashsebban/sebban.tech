<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151e22">
  <meta name="description" content="Play Asher Sebban’s original chess variations in one place.">
  <title>Asher’s Chess Variations</title>
  <link rel="stylesheet" href="./chess.css">
</head>
<body>
  <header class="shell">
    <a href="/games">Game Center</a>
    <h1>Asher’s Chess Variations</h1>
    <div class="mode-bar">
      <label for="variant">Game mode</label>
      <select id="variant" aria-describedby="mode-description">
        <option value="mongols">Mongol’s Chess</option>
        <option value="cathedral">Cathedral Chess</option>
        <option value="lancer">Lancer Chess</option>
        <option value="concord">Concord Chess</option>
        <option value="squires">Squire’s Chess</option>
      </select>
      <p id="mode-description" aria-live="polite"></p>
    </div>
  </header>
  <main id="game" aria-label="Playable chessboard"></main>
  <noscript><p>Enable JavaScript to play a chess variation.</p></noscript>
  <script type="module" src="./chess.mjs"></script>
</body>
</html>
