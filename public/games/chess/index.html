<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161a1c">
  <meta name="description" content="Choose a chess variation and play against the computer.">
  <title>Asher’s Chess Variations</title>
  <link rel="stylesheet" href="./chess.css?v=9">
</head>
<body>
  <header class="shell">
    <a class="home" href="/games">Game Center</a>
    <div id="gallery-heading">
      <h1>Asher’s Chess Variations</h1>
      <p id="gallery-prompt">Choose a category to play.</p>
      <a id="choose-category" class="gallery-back" href="./index.html" hidden>All categories</a>
    </div>
    <div id="match-heading" class="match-heading" hidden>
      <h1 id="mode-name" tabindex="-1"></h1>
      <div class="match-tools">
        <button id="match-piece-style" type="button" hidden></button>
        <a id="choose-variation" href="./index.html">Variations</a>
      </div>
    </div>
  </header>
  <main>
    <section id="categories" class="categories shell" aria-label="Chess categories">
      <a class="category classical" href="?category=classical"><strong>Classical</strong><span>Familiar pieces and standard moves with a fresh rule.</span></a>
      <a class="category experimental" href="?category=experimental"><strong>Experimental</strong><span>New mechanics, starting with Duel of Khans.</span></a>
    </section>
    <section id="gallery" class="gallery shell" aria-label="Chess variations"></section>
    <section id="game" aria-label="Playable chessboard" hidden></section>
  </main>
  <noscript><p>Enable JavaScript to play a chess variation.</p></noscript>
  <script type="module" src="./chess.mjs?v=14"></script>
</body>
</html>
